# Quality gate: on every push and pull request to main / production, the things
# that must stay green before anything deploys — type checking, the backend test
# suite, and the frontend lint. The backend lint runs too but does not block yet:
# it still carries pre-existing type-safety debt (unbound-method, no-unsafe-*),
# tracked separately. No database or secrets are needed — the tests mock Prisma
# and set their own JWT secrets.
name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate --workspace=backend

      - name: Type-check the backend
        run: npx tsc --noEmit
        working-directory: backend

      - name: Type-check the frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Backend tests
        run: npm run test --workspace=backend

      - name: Frontend lint
        run: npm run lint --workspace=frontend

      - name: Backend lint (not blocking yet — pre-existing debt)
        run: npm run lint --workspace=backend
        continue-on-error: true
