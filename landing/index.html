<!doctype html>
<html lang="fr" dir="ltr">
<head>

</style>
<title>Kiddoo · Logiciel de gestion de crèche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout concept: an editorial software brochure. A full-bleed dark photo slideshow opens the page,
   then calm white bands carry product screens, photo carousels and pricing. The logo's four colours
   appear as a 4-segment stripe (the brand signature) and as one colour per module. */
:root {
  --canvas: #FFFFFF;
  --band: #F5F4F1;
  --card: #FFFFFF;
  --ink: #111018;
  --text: #34323D;
  --muted: #6A6775;
  --line: #E5E2DC;
  --indigo: #4F49CF;
  --green: #13855F;
  --orange: #C25A12;
  --red: #CF2A50;
  --indigo-soft: #ECEBFB;
  --green-soft: #E2F3EC;
  --orange-soft: #FBEDE2;
  --red-soft: #FBE6EB;
  --night: #100F17;
  --ov: 250, 249, 246;
  --on-ov: #111018;
  --on-ov-2: rgba(17, 16, 24, .74);
  --on-ov-3: rgba(17, 16, 24, .52);
  --ov-line: rgba(17, 16, 24, .16);
  --ov-em: #4F49CF;
  --ov-tick: #13855F;
  --glass-bg: rgba(255, 255, 255, .6);
  --glass-bd: rgba(17, 16, 24, .22);
  --panel: #EDEBFA;
  --panel-shadow: 0 40px 80px -44px rgba(79, 73, 207, .45);
  --shadow: 0 1px 2px rgba(17,16,24,.06), 0 18px 40px -18px rgba(17,16,24,.28);
  --show-ink: block; --show-paper: none;
  --f-display: "Manrope", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --ls: -0.03em;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0E0D13; --band: #14131A; --card: #1A1922; --ink: #F4F2EE; --text: #DAD7E1; --muted: #A09CAA; --line: #2A2832;
    --indigo: #7D77F1; --green: #34B88A; --orange: #EF8C45; --red: #F2627F;
    --indigo-soft: #23214A; --green-soft: #142E27; --orange-soft: #33231A; --red-soft: #351C25;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.8);
    --show-ink: none; --show-paper: block; color-scheme: dark;
    --ov: 16, 15, 23; --on-ov: #FFFFFF; --on-ov-2: rgba(255, 255, 255, .78); --on-ov-3: rgba(255, 255, 255, .55);
    --ov-line: rgba(255, 255, 255, .22); --ov-em: #A7A2FF; --ov-tick: #7FE0BC;
    --glass-bg: rgba(255, 255, 255, .06); --glass-bd: rgba(255, 255, 255, .35);
    --panel: #100F17; --panel-shadow: 0 40px 80px -40px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  --canvas: #0E0D13; --band: #14131A; --card: #1A1922; --ink: #F4F2EE; --text: #DAD7E1; --muted: #A09CAA; --line: #2A2832;
  --indigo: #7D77F1; --green: #34B88A; --orange: #EF8C45; --red: #F2627F;
  --indigo-soft: #23214A; --green-soft: #142E27; --orange-soft: #33231A; --red-soft: #351C25;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.8);
  --show-ink: none; --show-paper: block; color-scheme: dark;
  --ov: 16, 15, 23; --on-ov: #FFFFFF; --on-ov-2: rgba(255, 255, 255, .78); --on-ov-3: rgba(255, 255, 255, .55);
  --ov-line: rgba(255, 255, 255, .22); --ov-em: #A7A2FF; --ov-tick: #7FE0BC;
  --glass-bg: rgba(255, 255, 255, .06); --glass-bd: rgba(255, 255, 255, .35);
  --panel: #100F17; --panel-shadow: 0 40px 80px -40px rgba(0, 0, 0, .7);
}
:root[lang="ar"] { --f-display: "IBM Plex Sans Arabic", system-ui, sans-serif; --f-body: "IBM Plex Sans Arabic", system-ui, sans-serif; --ls: 0; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--canvas); color: var(--text); font-family: var(--f-body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--canvas); }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); letter-spacing: var(--ls); text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
section { padding-block: clamp(64px, 8vw, 104px); scroll-margin-top: 68px; }
/* One continuous canvas: sections share the page background; the logo's pebbles drift behind all of them */
.band { background: transparent; }
main { position: relative; isolation: isolate; overflow-x: clip; }
.bg-pebbles { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg-pebbles svg { position: absolute; width: var(--s); height: var(--s); color: var(--k); opacity: var(--o, 1); translate: 0 var(--py, 0px); animation: drift2 var(--d, 18s) ease-in-out infinite alternate; will-change: transform, translate; }
.bg-pebbles .p-i { --k: var(--indigo-soft); }
.bg-pebbles .p-g { --k: var(--green-soft); }
.bg-pebbles .p-o { --k: var(--orange-soft); }
.bg-pebbles .p-r { --k: var(--red-soft); }
@keyframes drift2 { from { transform: rotate(var(--r0, 0deg)) translateY(0); } to { transform: rotate(var(--r1, 10deg)) translateY(-28px); } }

/* Brand stripe: the logo's four colours as one signature line */
.stripe { display: flex; gap: 4px; height: 4px; width: 72px; }
.stripe i { flex: 1; border-radius: 4px; }
.stripe i:nth-child(1) { background: var(--indigo); } .stripe i:nth-child(2) { background: var(--green); }
.stripe i:nth-child(3) { background: var(--orange); } .stripe i:nth-child(4) { background: var(--red); }

.logo { display: inline-flex; align-items: center; direction: ltr; text-decoration: none; }
.logo img { height: 28px; width: auto; }
.logo .ink { display: var(--show-ink); } .logo .paper { display: var(--show-paper); }
.logo.on-dark .ink { display: none; } .logo.on-dark .paper { display: block; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 600 15px/1 var(--f-body); text-decoration: none; padding: 15px 22px; border-radius: 10px; border: 1.5px solid transparent; cursor: pointer; transition: background .2s, border-color .2s, transform .2s; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--indigo); color: #FFFFFF; }
.btn-primary:hover { background: color-mix(in srgb, var(--indigo) 86%, #000); }
.btn-line { border-color: var(--line); color: var(--ink); background: transparent; }
.btn-line:hover { border-color: var(--ink); }
.btn-glass { color: var(--on-ov); border-color: var(--glass-bd); background: var(--glass-bg); backdrop-filter: blur(6px); }
.btn-glass:hover { border-color: var(--on-ov); }

/* Nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: color-mix(in srgb, var(--canvas) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 64px; }
.nav-links { display: flex; gap: 26px; }
.nav-links a { text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; }
.nav-links a:hover { color: var(--ink); }
.nav-end { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
.lang { background: none; border: 1.5px solid var(--line); color: var(--ink); font: 500 14px/1 var(--f-body); padding: 10px 13px; border-radius: 10px; cursor: pointer; }
.nav .btn { padding: 11px 16px; font-size: 14px; }
@media (max-width: 900px) { .nav-links { display: none; } }
@media (max-width: 440px) { .nav .btn .long { display: none; } }
@media (min-width: 441px) { .nav .btn .short { display: none; } }

/* Photo slots: real photos go in images/<name>.jpg; until then a designed placeholder shows */
.ph { position: relative; overflow: hidden; background: var(--ph-bg, var(--indigo-soft)); margin: 0; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; }
.ph.has-img img { opacity: 1; }
.ph .ph-art { position: absolute; inset: 0; }
.ph.has-img .ph-art, .ph.has-img .ph-tag { display: none; }
.ph-tag { position: absolute; inset-block-end: 12px; inset-inline-start: 12px; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--ph-fg, var(--indigo)); background: color-mix(in srgb, var(--card) 85%, transparent); border: 1px dashed color-mix(in srgb, var(--ph-fg, var(--indigo)) 50%, transparent); padding: 6px 10px; border-radius: 8px; max-width: calc(100% - 24px); }
.ph-tag svg { width: 14px; height: 14px; flex: none; }
.ph-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-indigo { --ph-bg: var(--indigo-soft); --ph-fg: var(--indigo); }
.t-green { --ph-bg: var(--green-soft); --ph-fg: var(--green); }
.t-orange { --ph-bg: var(--orange-soft); --ph-fg: var(--orange); }
.t-red { --ph-bg: var(--red-soft); --ph-fg: var(--red); }

/* Hero slideshow (always dark: photos sit under a night overlay) */
.hero { position: relative; background: rgb(var(--ov)); color: var(--on-ov); overflow: hidden; padding: 0; height: clamp(500px, calc(100svh - 64px), 640px); }
.slides { position: absolute; inset: 0; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; }
.slide.on { opacity: 1; }
.slide .ph { position: absolute; inset: 0; --ph-bg: rgb(var(--ov)); }
.slide.on .ph img, .slide.on .ph .ph-art { animation: drift 5s ease-out both; }
.slide .ph[data-photo="hero-parent"] img { object-position: 100% 30%; }
.slide .ph[data-photo="hero-direction"] img { object-position: 100% 55%; }
.slide .ph[data-photo="hero-classe"] img { object-position: 100% 55%; }
@keyframes drift { from { transform: scale(1.06); } to { transform: scale(1); } }
.hero .ph-tag { inset-block-end: auto; inset-block-start: 18px; inset-inline-start: auto; inset-inline-end: 18px; background: rgba(16,15,23,.6); color: #FFFFFF; border-color: rgba(255,255,255,.35); }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(var(--ov), .95) 0%, rgba(var(--ov), .84) 38%, rgba(var(--ov), .22) 72%, rgba(var(--ov), .08) 100%); }
:root[dir="rtl"] .hero::after { background: linear-gradient(270deg, rgba(var(--ov), .95) 0%, rgba(var(--ov), .84) 38%, rgba(var(--ov), .22) 72%, rgba(var(--ov), .08) 100%); }
.hero-inner { position: relative; z-index: 2; height: 100%; display: grid; grid-template-rows: 1fr auto; padding-block: clamp(36px, 6vh, 64px) 26px; }
.hero-copy { align-self: center; display: grid; gap: 20px; max-width: 600px; justify-items: start; }
.hero h1 { color: var(--on-ov); font-size: clamp(2.3rem, 4.6vw, 3.7rem); line-height: 1.04; font-weight: 800; }
:root[lang="ar"] .hero h1 { line-height: 1.3; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--ov-em); }
.hero .lead { color: var(--on-ov-2); font-size: clamp(1rem, 1.4vw, 1.15rem); max-width: 34em; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--on-ov-2); }
.hero-meta span { display: inline-flex; gap: 8px; align-items: center; }
.hero-meta svg { width: 16px; height: 16px; color: var(--ov-tick); }
.float-card { position: absolute; z-index: 2; inset-inline-end: max(20px, calc((100vw - 1200px) / 2 + 20px)); bottom: 120px; width: min(320px, 40vw); background: rgba(255,255,255,.96); color: #111018; border-radius: 14px; padding: 14px 16px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; transition: opacity .5s, transform .5s; }
.float-card .fi { grid-row: span 2; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #FFFFFF; }
.float-card .fi svg { width: 20px; height: 20px; }
.float-card b { font-size: 14.5px; line-height: 1.3; }
.float-card span { font-size: 13px; color: #6A6775; line-height: 1.35; }
.float-card.swap { opacity: 0; transform: translateY(8px); }
@media (max-width: 860px) { .float-card { display: none; } }
.dots-bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.sd { background: none; border: 0; padding: 12px 0 0; text-align: start; color: var(--on-ov-3); font: 500 14px/1.3 var(--f-body); cursor: pointer; position: relative; }
.sd::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; border-radius: 3px; background: var(--ov-line); }
.sd i { position: absolute; inset-block-start: 0; inset-inline-start: 0; height: 3px; width: 0; border-radius: 3px; background: var(--c); }
.sd.on { color: var(--on-ov); }
.sd.on i { animation: fill var(--dur, 7s) linear forwards; }
.sd.done i { width: 100%; }
.paused .sd.on i { animation-play-state: paused; }
@keyframes fill { to { width: 100%; } }
.sd small { display: block; color: var(--on-ov-3); font-size: 12.5px; margin-top: 3px; }
@media (max-width: 600px) { .sd small { display: none; } }

/* Facts strip */
.facts { border-bottom: 1px solid var(--line); }
.facts .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fact { display: flex; gap: 14px; align-items: center; padding: 24px 18px; border-inline-start: 1px solid var(--line); }
.fact:first-child { border-inline-start: 0; padding-inline-start: 0; }
.fact .fi { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.fact .fi svg { width: 20px; height: 20px; }
.fact b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.3; }
.fact span { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
@media (max-width: 900px) { .facts .wrap { grid-template-columns: 1fr 1fr; } .fact:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; } .fact:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 520px) { .facts .wrap { grid-template-columns: 1fr; } .fact { border-inline-start: 0; padding-inline-start: 0; } .fact + .fact { border-top: 1px solid var(--line); } }
.fi.c1 { background: var(--indigo-soft); color: var(--indigo); } .fi.c2 { background: var(--green-soft); color: var(--green); }
.fi.c3 { background: var(--orange-soft); color: var(--orange); } .fi.c4 { background: var(--red-soft); color: var(--red); }

/* Section heads */
.head { display: grid; gap: 14px; max-width: 700px; margin-bottom: clamp(32px, 4vw, 52px); }
.head.center { text-align: center; justify-items: center; margin-inline: auto; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 12px; }
:root[lang="ar"] .kicker { letter-spacing: 0; font-size: 14px; }
.head h2 { font-size: clamp(1.9rem, 3.4vw, 2.7rem); line-height: 1.12; font-weight: 800; }
:root[lang="ar"] .head h2 { line-height: 1.35; font-weight: 700; }
.head p { color: var(--muted); font-size: 1.07rem; }

/* Product showcase carousel */
.show-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
.show-tabs::-webkit-scrollbar { display: none; }
.stab { position: relative; background: none; border: 0; padding: 14px 16px 16px; font: 500 15px/1 var(--f-body); color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 9px; align-items: center; }
.stab svg { width: 18px; height: 18px; color: var(--c); }
.stab[aria-selected="true"] { color: var(--ink); }
.stab::after { content: ""; position: absolute; inset-inline: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--line); transform: scaleX(0); transition: transform .3s; }
.stab[aria-selected="true"]::after { transform: scaleX(1); background: var(--c); }
.stab .bar { position: absolute; inset-inline-start: 10px; bottom: -1px; height: 3px; width: 0; background: var(--c); opacity: .35; border-radius: 3px; }
.stab[aria-selected="true"] .bar { animation: fill2 var(--dur, 8s) linear forwards; }
.show-paused .stab .bar { animation-play-state: paused; }
@keyframes fill2 { to { width: calc(100% - 20px); } }
.show { display: grid; grid-template-columns: .82fr 1.18fr; gap: clamp(28px, 4vw, 56px); align-items: center; }
.show-copy { display: grid; gap: 16px; min-width: 0; }
.show-copy h3 { font-size: clamp(1.5rem, 2.4vw, 1.9rem); line-height: 1.2; font-weight: 800; }
:root[lang="ar"] .show-copy h3 { font-weight: 700; line-height: 1.4; }
.show-copy p { color: var(--muted); }
.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.ticks li { display: flex; gap: 11px; align-items: flex-start; }
.ticks svg { width: 20px; height: 20px; flex: none; color: var(--c, var(--green)); margin-top: 2px; }
.show-nav { display: flex; gap: 8px; margin-top: 6px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.round:hover { border-color: var(--ink); }
.round svg { width: 18px; height: 18px; }
:root[dir="rtl"] .round svg { transform: scaleX(-1); }
.show-stage { position: relative; min-width: 0; }
.show-stage.anim > * { animation: rise .45s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (max-width: 900px) { .show { grid-template-columns: 1fr; } }

/* App window mock */
.win { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.win-bar { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--band); }
.win-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.win-bar span { margin-inline-start: 10px; font-size: 12.5px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; direction: ltr; }
.app { display: grid; grid-template-columns: 150px 1fr; min-height: 330px; }
.side { border-inline-end: 1px solid var(--line); padding: 14px 10px; display: grid; gap: 4px; align-content: start; font-size: 13px; color: var(--muted); }
.side div { padding: 7px 9px; border-radius: 7px; display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.side div.on { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }
.side svg { width: 15px; height: 15px; flex: none; }
.main { padding: 18px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.main h4 { margin: 0; font: 700 16px/1.3 var(--f-display); color: var(--ink); display: flex; align-items: center; gap: 10px; }
.main h4 small { font: 400 12.5px/1 var(--f-body); color: var(--muted); margin-inline-start: auto; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .app { grid-template-columns: 1fr; } .side { display: none; } }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kpi b { display: block; font: 800 1.35rem/1.2 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; }
@media (max-width: 600px) { .kpis { grid-template-columns: 1fr 1fr; } }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
@media (max-width: 600px) { .two { grid-template-columns: 1fr; } }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel .pt { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; height: 120px; }
.bars div { display: grid; gap: 6px; justify-items: center; align-self: end; }
.bars i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--indigo); }
.bars i.lo { background: var(--orange); }
.bars span { font-size: 11px; color: var(--muted); }
.bars b { font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; }
.rows { display: grid; }
.r { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.r:last-child { border-bottom: 0; }
.r .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.r .nm { color: var(--ink); font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r .sub { color: var(--muted); font-size: 12px; }
.r .end { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.chip { font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.wait { background: var(--orange-soft); color: var(--orange); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.seg3 { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg3 b { font-size: 11.5px; font-weight: 600; padding: 5px 9px; color: var(--muted); border-inline-start: 1px solid var(--line); }
.seg3 b:first-child { border-inline-start: 0; }
.seg3 b.p { background: var(--green); color: #FFFFFF; }
.seg3 b.l { background: var(--orange); color: #FFFFFF; }
.seg3 b.a { background: var(--red); color: #FFFFFF; }
.msgs { display: grid; gap: 10px; }
.bub { max-width: 78%; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; }
.bub small { display: block; font-size: 11px; opacity: .7; margin-top: 3px; }
.bub.in { background: var(--band); color: var(--ink); border-end-start-radius: 4px; justify-self: start; }
.bub.out { background: var(--indigo); color: #FFFFFF; border-end-end-radius: 4px; justify-self: end; }
.annc { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-inline-start: 4px solid var(--orange); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.annc b { color: var(--ink); display: block; }
.annc .btn { padding: 8px 12px; font-size: 12.5px; margin-inline-start: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: start; font-weight: 500; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 6px; border-bottom: 1px solid var(--line); }
:root[lang="ar"] .tbl th { letter-spacing: 0; text-transform: none; }
.tbl td { padding: 10px 6px; border-bottom: 1px solid var(--line); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl-wrap { overflow-x: auto; }
.total { display: flex; justify-content: space-between; align-items: baseline; background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500; }
.total b { font: 800 1.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: 96px repeat(5, minmax(0, 1fr)); gap: 6px; font-size: 12px; }
.week .h { color: var(--muted); text-align: center; font-weight: 500; padding-bottom: 4px; }
.week .who { color: var(--ink); font-weight: 500; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.week .sh { border-radius: 7px; padding: 7px 4px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; }
.sh.a { background: var(--indigo-soft); color: var(--indigo); } .sh.b { background: var(--green-soft); color: var(--green); }
.sh.c { background: var(--orange-soft); color: var(--orange); } .sh.off { background: var(--band); color: var(--muted); }
.sh.sub { background: var(--red-soft); color: var(--red); }
@media (max-width: 600px) { .week { grid-template-columns: 70px repeat(5, minmax(0, 1fr)); font-size: 11px; } }

/* Real screenshots */
.app-shot { display: block; width: 100%; height: auto; }
.phone.shot { width: 250px; max-height: 540px; padding: 0; }
.phone.shot img { display: block; width: 100%; height: auto; }

/* Phone mock */
.phone-row { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.phone { width: 270px; border: 10px solid #15141C; border-radius: 38px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; justify-self: center; }
.phone .notch { height: 22px; display: grid; place-items: center; }
.phone .notch i { width: 70px; height: 6px; border-radius: 6px; background: #15141C; }
.phone .scr { padding: 6px 14px 18px; display: grid; gap: 10px; }
.phone .who2 { display: flex; gap: 10px; align-items: center; }
.phone .who2 .av { width: 38px; height: 38px; border-radius: 50%; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.phone .who2 b { color: var(--ink); font-size: 14px; display: block; line-height: 1.2; }
.phone .who2 span { color: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--band); border-radius: 12px; padding: 10px; display: grid; gap: 2px; }
.tile svg { width: 16px; height: 16px; color: var(--c); }
.tile b { color: var(--ink); font-size: 13px; }
.tile span { color: var(--muted); font-size: 11.5px; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumbs .ph { aspect-ratio: 1; border-radius: 10px; }
.thumbs .ph-tag { display: none; }
.side-notes { display: grid; gap: 12px; }
.note { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.note svg { width: 20px; height: 20px; flex: none; color: var(--c); margin-top: 2px; }
.note b { color: var(--ink); display: block; }
.note span { color: var(--muted); font-size: 13px; }
@media (max-width: 600px) { .phone-row { grid-template-columns: 1fr; } }

/* Split rows with photos */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
.split + .split { margin-top: clamp(56px, 7vw, 96px); }
.split.rev .split-media { order: 2; }
.split-media { position: relative; min-width: 0; }
.split-media .ph { aspect-ratio: 5 / 4; border-radius: 18px; }
.split-media .ph-tag { inset-block-end: auto; inset-block-start: 12px; }
.split-media .mini { position: absolute; inset-block-end: -22px; inset-inline-end: -14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; gap: 12px; align-items: center; max-width: 290px; }
.split.rev .split-media .mini { inset-inline-end: auto; inset-inline-start: -14px; }
.mini .fi { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.mini .fi svg { width: 18px; height: 18px; }
.mini b { color: var(--ink); font-size: 14px; display: block; line-height: 1.3; }
.mini span { color: var(--muted); font-size: 12.5px; line-height: 1.35; display: block; }
.split-copy { display: grid; gap: 16px; min-width: 0; }
.split-copy h3 { font-size: clamp(1.6rem, 2.6vw, 2.1rem); line-height: 1.15; font-weight: 800; }
:root[lang="ar"] .split-copy h3 { font-weight: 700; line-height: 1.4; }
.split-copy p { color: var(--muted); }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } .split.rev .split-media { order: 0; } .split-media .mini { inset-inline-end: 10px; } .split.rev .split-media .mini { inset-inline-start: 10px; } }

/* Day carousel */
.day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 32px; }
.day-head .head { margin-bottom: 0; }
.day-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 320px); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding-bottom: 14px; scrollbar-width: thin; }
.day-card { scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; padding: 8px; }
/* One look for every photo: same grade, same frame, the card's colour washing up from the bottom */
.day-media { position: relative; border-radius: 14px; overflow: hidden; isolation: isolate; aspect-ratio: 4 / 3; }
.day-card .ph { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.day-card .ph img { filter: saturate(.88) contrast(1.06) brightness(1.03) sepia(.06); }
.day-media::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, transparent 45%, color-mix(in srgb, var(--c) 55%, transparent) 100%), linear-gradient(0deg, color-mix(in srgb, var(--c) 10%, transparent), color-mix(in srgb, var(--c) 10%, transparent));
  mix-blend-mode: multiply; transition: opacity .4s ease; }
.day-card:hover .day-media::after { opacity: .55; }
.day-chip { position: absolute; z-index: 2; inset-block-end: 12px; inset-inline-start: 12px; display: inline-flex; align-items: center; gap: 7px; background: var(--card); color: var(--c); padding: 7px 12px 7px 9px; border-radius: 999px; box-shadow: 0 8px 20px -8px rgba(17, 16, 24, .45); direction: ltr; }
.day-chip svg { width: 16px; height: 16px; }
.day-chip b { font: 800 14px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.day-pebble { position: absolute; z-index: 2; inset-block-start: -18px; inset-inline-end: -18px; width: 74px; height: 74px; color: var(--c); opacity: .9; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
.day-card:hover .day-pebble { transform: rotate(-14deg) scale(1.1); }
.day-card .ph-tag { display: none; }
.day-body { padding: 16px 10px 10px; display: grid; gap: 8px; grid-template-rows: auto 1fr auto; }
.day-time { font: 800 14px/1 var(--f-display); color: var(--c); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; direction: ltr; justify-content: flex-start; }
:root[dir="rtl"] .day-time { justify-content: flex-end; }
.day-body h3 { font-size: 1.1rem; font-weight: 700; }
.day-body p { color: var(--muted); font-size: 14.5px; }
.day-body .rec { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); background: var(--band); border-radius: 8px; padding: 7px 10px; margin-top: 4px; }
.day-body .rec svg { width: 15px; height: 15px; color: var(--c); flex: none; }

/* Steps */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; counter-reset: s; border-top: 1px solid var(--line); }
.step { padding: 26px 22px 6px 0; display: grid; gap: 10px; align-content: start; position: relative; }
:root[dir="rtl"] .step { padding: 26px 0 6px 22px; }
.step::before { content: ""; position: absolute; inset-block-start: -2px; inset-inline-start: 0; width: 44px; height: 3px; border-radius: 3px; background: var(--c); }
.step .n { font: 800 13px/1 var(--f-display); color: var(--c); letter-spacing: .06em; }
.step h3 { font-size: 1.12rem; font-weight: 700; }
.step p { color: var(--muted); font-size: 15px; }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr 1fr; row-gap: 20px; } }
@media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }

/* Pricing */
.price-ctrl { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; margin-bottom: 52px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px; box-shadow: 0 1px 2px rgba(17,16,24,.05); }
.seg button { font: 600 14.5px/1 var(--f-body); border: 0; background: none; color: var(--muted); padding: 12px 20px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: background .2s, color .2s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--canvas); }
.save { font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-soft); padding: 4px 8px; border-radius: 999px; }
.cur { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.cur select { font: 500 14px/1 var(--f-body); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
.plan { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.plan::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
.plan.featured { border-color: var(--indigo); box-shadow: var(--shadow); }
.plan .rec { position: absolute; inset-block-start: 20px; inset-inline-end: 20px; font-size: 12px; font-weight: 600; color: #FFFFFF; background: var(--indigo); padding: 5px 10px; border-radius: 6px; }
.plan h3 { font-size: 1.25rem; font-weight: 800; }
.plan .for { color: var(--muted); font-size: 14.5px; margin-top: -10px; }
.amount { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 16px 0; border-block: 1px solid var(--line); }
.amount b { font: 800 clamp(1.9rem, 3vw, 2.3rem)/1.1 var(--f-display); color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.amount .per { color: var(--muted); font-size: 14.5px; }
.amount .was { flex-basis: 100%; font-size: 13px; color: var(--muted); }
.amount .child { flex-basis: 100%; font-size: 13.5px; font-weight: 600; color: var(--green); }
.plan .ticks { flex: 1; font-size: 14.5px; gap: 10px; }
.plan .btn { width: 100%; }
.price-note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 22px; }
@media (max-width: 960px) { .plans { grid-template-columns: 1fr; max-width: 520px; margin-inline: auto; } }

/* FAQ */
.faq-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(28px, 5vw, 72px); align-items: start; }
.faq-grid .head { margin-bottom: 0; }
.faq-media .ph { aspect-ratio: 4 / 3; border-radius: 16px; margin-top: 18px; }
.faqs { min-width: 0; border-top: 1px solid var(--line); }
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 20px 0; font-weight: 600; color: var(--ink); display: flex; gap: 16px; align-items: center; font-size: 16.5px; }
summary::-webkit-details-marker { display: none; }
summary .pm { margin-inline-start: auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; transition: transform .25s; }
summary .pm svg { width: 13px; height: 13px; }
details[open] summary .pm { transform: rotate(45deg); background: var(--ink); color: var(--canvas); border-color: var(--ink); }
details p { padding-bottom: 20px; color: var(--muted); max-width: 62ch; }
@media (max-width: 860px) { .faq-grid { grid-template-columns: 1fr; } }

/* Closing CTA over a photo */
.cta { padding-block: 0 clamp(64px, 8vw, 104px); }
.cta-box { position: relative; border-radius: 22px; overflow: hidden; background: rgb(var(--ov)); color: var(--on-ov); box-shadow: var(--panel-shadow); min-height: 360px; display: grid; align-items: center; }
.cta-box > .ph { position: absolute; inset: 0; --ph-bg: #1B1A2B; }
.cta-box > .ph img { object-position: 50% 38%; }
.cta-box::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--ov), .95), rgba(var(--ov), .7) 55%, rgba(var(--ov), .15)); }
:root[dir="rtl"] .cta-box::after { background: linear-gradient(270deg, rgba(var(--ov), .95), rgba(var(--ov), .7) 55%, rgba(var(--ov), .15)); }
.cta-box .ph-tag { inset-block-end: auto; inset-block-start: 16px; inset-inline-start: auto; inset-inline-end: 16px; background: rgba(16,15,23,.6); color: #FFFFFF; border-color: rgba(255,255,255,.35); }
.cta-in { position: relative; z-index: 2; padding: clamp(32px, 5vw, 64px); display: grid; gap: 18px; max-width: 640px; justify-items: start; }
.cta-in h2 { color: var(--on-ov); font-size: clamp(1.9rem, 3.4vw, 2.7rem); line-height: 1.12; font-weight: 800; }
:root[lang="ar"] .cta-in h2 { line-height: 1.35; font-weight: 700; }
.cta-in p { color: var(--on-ov-2); font-size: 1.07rem; }
.num { font-size: 14px; color: var(--on-ov-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.num b { direction: ltr; unicode-bidi: isolate; user-select: all; font-variant-numeric: tabular-nums; color: var(--on-ov); }
.copy { background: var(--glass-bg); border: 1px solid var(--glass-bd); color: var(--on-ov); font: 500 13px/1 var(--f-body); padding: 7px 10px; border-radius: 7px; cursor: pointer; }

footer { border-top: 1px solid var(--line); padding-block: 40px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: center; justify-content: space-between; }
footer p { color: var(--muted); font-size: 14px; }
.flinks { display: flex; flex-wrap: wrap; gap: 22px; }
.flinks a { color: var(--muted); text-decoration: none; font-size: 14px; }
.flinks a:hover { color: var(--ink); }

/* ── Motion: one load sequence in the hero, then short rises as sections enter ── */
.hero-copy > * { animation: up .8s cubic-bezier(.2, .7, .2, 1) both; }
.hero-copy > *:nth-child(2) { animation-delay: .08s; }
.hero-copy > *:nth-child(3) { animation-delay: .16s; }
.hero-copy > *:nth-child(4) { animation-delay: .24s; }
.hero-copy > *:nth-child(5) { animation-delay: .32s; }
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
/* Elements rest in place; entering the screen only plays a short rise */
.rv.in { animation: rise3 .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rise3 { from { transform: translateY(22px); opacity: .35; } to { transform: none; opacity: 1; } }

/* Nav: lifts once the page scrolls, marks the section in view */
.nav { transition: box-shadow .25s ease; }
.nav.scrolled { box-shadow: 0 8px 24px -14px rgba(17, 16, 24, .35); }
.nav-links a { position: relative; }
.nav-links a.on { color: var(--ink); }
.nav-links a.on::after { content: ""; position: absolute; inset-inline: 0; bottom: -22px; height: 2px; border-radius: 2px; background: var(--indigo); }

/* Before / with Kiddoo */
.ba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 22px; align-items: stretch; }
.ba-card { border-radius: 18px; padding: clamp(22px, 3vw, 32px); display: grid; gap: 18px; align-content: start; min-width: 0; }
.ba-card.before { background: var(--band); border: 1px dashed var(--line); }
.ba-card.after { background: var(--card); border: 1.5px solid var(--indigo); box-shadow: var(--shadow); }
.ba-card h3 { font-size: 1.15rem; font-weight: 800; display: flex; gap: 10px; align-items: center; }
:root[lang="ar"] .ba-card h3 { font-weight: 700; }
.ba-card .tag { font: 600 12px/1 var(--f-body); padding: 6px 10px; border-radius: 999px; }
.before .tag { background: var(--red-soft); color: var(--red); }
.after .tag { background: var(--indigo-soft); color: var(--indigo); }
.ba-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.ba-card li { display: flex; gap: 12px; align-items: center; font-size: 15.5px; line-height: 1.45; }
.before li { color: var(--muted); }
.before li .x { width: 26px; height: 26px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; flex: none; }
.before li .x svg { width: 13px; height: 13px; }
.after li { color: var(--ink); font-weight: 500; }
.after li .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; color: #FFFFFF; background: var(--c); }
.after li .ic svg { width: 19px; height: 19px; }
.ba-arrow { align-self: center; width: 54px; height: 54px; border-radius: 50%; background: var(--indigo); color: #FFFFFF; display: grid; place-items: center; box-shadow: var(--shadow); animation: nudge 2.4s ease-in-out infinite; }
.ba-arrow svg { width: 22px; height: 22px; }
:root[dir="rtl"] .ba-arrow svg { transform: scaleX(-1); }
@keyframes nudge { 0%, 100% { translate: 0 0; } 50% { translate: 5px 0; } }
:root[dir="rtl"] .ba-arrow { animation-name: nudge-rtl; }
@keyframes nudge-rtl { 0%, 100% { translate: 0 0; } 50% { translate: -5px 0; } }
@media (max-width: 860px) { .ba { grid-template-columns: 1fr; } .ba-arrow { justify-self: center; rotate: 90deg; animation: none; } :root[dir="rtl"] .ba-arrow { rotate: -90deg; } }

/* Numbers band (always dark, like the hero) */
.numbers { padding-block: clamp(24px, 3vw, 40px); }
.num-card { background: var(--panel); color: var(--on-ov); position: relative; overflow: hidden; isolation: isolate; border-radius: 28px; padding: clamp(36px, 5vw, 64px) clamp(24px, 5vw, 64px); box-shadow: var(--panel-shadow); }
.num-card > .head, .num-card > .nums { position: relative; }
.numbers .deco svg { animation: drift2 16s ease-in-out infinite alternate; }
.numbers .head h2 { color: var(--on-ov); }
.numbers .head p, .numbers .kicker { color: var(--on-ov-2); }
.numbers .deco { position: absolute; inset: 0; pointer-events: none; }
.numbers .deco svg { position: absolute; opacity: .14; }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.stat { display: grid; gap: 10px; padding-inline-start: 18px; border-inline-start: 3px solid var(--c); align-content: start; }
.stat b { font: 800 clamp(2.6rem, 5vw, 3.6rem)/1 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; justify-self: start; }
.stat b small { font-size: .45em; letter-spacing: 0; margin-inline-start: 4px; color: var(--on-ov-2); }
.stat > span { color: var(--on-ov-2); font-size: 15px; max-width: 16em; }
@media (max-width: 760px) { .nums { grid-template-columns: 1fr 1fr; row-gap: 32px; } }

/* Reassurance under pricing */
.assure { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 30px; margin-top: 30px; }
.assure span { display: inline-flex; gap: 9px; align-items: center; font-size: 14.5px; color: var(--ink); font-weight: 500; }
.assure svg { width: 18px; height: 18px; color: var(--green); flex: none; }

/* Step pebbles: the logo's shapes as small spot illustrations */
.step .si { width: 50px; height: 46px; display: grid; place-items: center; color: #FFFFFF; background: var(--c); margin-bottom: 4px; transition: border-radius .5s ease, transform .3s ease; }
.step .si svg { width: 22px; height: 22px; }
.step:nth-child(1) .si { border-radius: 50%; }
.step:nth-child(2) .si { border-radius: 12px 22px 18px 10px / 12px 18px 20px 10px; }
.step:nth-child(3) .si { border-radius: 50% 50% 10px 10px / 60% 60% 10px 10px; }
.step:nth-child(4) .si { border-radius: 20px 14px 8px 18px / 18px 12px 8px 16px; }
.step:hover .si { transform: rotate(-6deg) scale(1.05); }

/* Floating WhatsApp contact */
/* WhatsApp and e-mail, stacked in the corner; the e-mail one is quieter so WhatsApp stays the main call */
.fabs { position: fixed; z-index: 40; inset-block-end: calc(20px + env(safe-area-inset-bottom, 0px)); inset-inline-end: calc(20px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.fabs .fab { justify-content: center; }
.fab { position: relative; display: inline-flex; align-items: center; gap: 10px; background: #1E9E52; color: #FFFFFF; text-decoration: none; font: 600 15px/1 var(--f-body); padding: 14px 18px; border-radius: 999px; box-shadow: 0 16px 32px -12px rgba(14, 80, 44, .65); transition: transform .2s ease; }
.fab:hover { transform: translateY(-2px); }
.fab svg { width: 22px; height: 22px; flex: none; }
.fab::before { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--fab, #1E9E52); animation: ring 2.6s ease-out infinite; }
/* Same button as WhatsApp, in the brand indigo with an envelope; its ring pulses half a beat later */
.fab.mail { --fab: #4F49CF; background: var(--fab); box-shadow: 0 16px 32px -12px rgba(47, 42, 154, .65); }
.fab.mail::before { animation-delay: 1.3s; }
button.fab { border: 0; cursor: pointer; }
/* A plain mailto link does nothing on a computer without a mail app: the button offers webmail or a copy */
.mail-pop { position: absolute; inset-block-end: calc(100% + 12px); inset-inline-end: 0; display: grid; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; min-width: 240px; }
.mail-pop[hidden] { display: none; }
.mail-pop b { font-size: 13.5px; color: var(--ink); padding: 6px 10px 8px; direction: ltr; unicode-bidi: isolate; text-align: start; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.mail-pop a, .mail-pop button { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 0; background: none; color: var(--ink); font: 500 14.5px/1.2 var(--f-body); text-decoration: none; cursor: pointer; text-align: start; }
.mail-pop a:hover, .mail-pop button:hover { background: var(--band); }
.mail-pop svg { width: 18px; height: 18px; color: var(--indigo); flex: none; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
@media (max-width: 600px) { .fab .lbl { display: none; } .fab { padding: 15px; } }

/* Screenshot zoom */
.show-stage .win { position: relative; }
.zoomable { cursor: zoom-in; }
.zoom-hint { position: absolute; inset-block-end: 12px; inset-inline-end: 12px; display: inline-flex; gap: 6px; align-items: center; background: rgba(17, 16, 24, .78); color: #FFFFFF; font-size: 12.5px; padding: 7px 11px; border-radius: 8px; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.zoom-hint svg { width: 14px; height: 14px; }
.show-stage .win:hover .zoom-hint, .show-stage .win:focus-within .zoom-hint { opacity: 1; }
.lightbox[hidden] { display: none; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(10, 9, 15, .88); display: grid; place-items: center; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .25s ease both; }
.lightbox img { max-width: min(1400px, 100%); max-height: 86vh; width: auto; height: auto; border-radius: 12px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); }
.lb-close { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); inset-inline-end: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #FFFFFF; display: grid; place-items: center; cursor: pointer; }
.lb-close svg { width: 18px; height: 18px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Split rows: pebble behind an organic photo frame, two floating cards, icon features */
.split-media { padding: 26px; }
.split-pebble { position: absolute; z-index: -1; width: 78%; height: auto; aspect-ratio: 1; color: var(--soft); inset-block-start: -4%; inset-inline-start: -8%; animation: drift2 18s ease-in-out infinite alternate; --r0: -6deg; --r1: 8deg; }
.split.rev .split-pebble { inset-inline-start: auto; inset-inline-end: -8%; }
.split-pebble.small { width: 26%; inset-block-start: auto; inset-block-end: -6%; inset-inline-start: auto; inset-inline-end: -4%; color: var(--c); opacity: .9; animation-duration: 12s; }
.split.rev .split-pebble.small { inset-inline-end: auto; inset-inline-start: -4%; }
.split-frame { position: relative; border-radius: 28px 90px 28px 28px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(17, 16, 24, .45); }
.split.rev .split-frame { border-radius: 90px 28px 28px 28px; }
.split-frame .ph { border-radius: 0; }
.split-frame .ph img { filter: saturate(.9) contrast(1.05) brightness(1.03) sepia(.05); }
.split-frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--c) 35%, transparent)); mix-blend-mode: multiply; }
.split-media .mini { inset-block-end: 0; inset-inline-end: 0; z-index: 2; }
.split.rev .split-media .mini { inset-inline-end: auto; inset-inline-start: 0; }
.split-media .mini.top { inset-block-end: auto; inset-block-start: 4px; inset-inline-end: auto; inset-inline-start: 0; max-width: 260px; animation-delay: -2s; }
/* The director stands on the photo's right: his chart goes top-left, over the wall of drawings */
.split.rev .split-media .mini.top { inset-inline-start: 0; inset-inline-end: auto; }
:root[dir="rtl"] .split.rev .split-media .mini.top { inset-inline-start: auto; inset-inline-end: 0; }
/* Amount card on the opposite corner: the two cards frame the photo on a diagonal */
.split.rev .split-media .mini:not(.top) { inset-inline-start: auto; inset-inline-end: 0; }
.mini.top > span:last-child > span { font-size: 12.5px; }
.mini.chart { display: grid; gap: 10px; padding: 12px 16px 10px; }
.mini.chart > b { font-size: 13px; }
.mbars { display: grid; grid-template-columns: repeat(5, 30px); gap: 8px; align-items: end; height: 70px; }
.mbars div { display: grid; gap: 4px; justify-items: center; align-self: end; }
.mbars i { display: block; width: 18px; height: var(--h); border-radius: 5px 5px 2px 2px; background: var(--indigo); transform-origin: bottom; animation: barup .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(.3s + var(--j) * .08s); }
.mbars div:nth-child(3) i { background: var(--orange); }
.mbars span { font-size: 10.5px; color: var(--muted); }
@keyframes barup { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.split-tag { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--c); background: var(--soft); padding: 6px 12px 6px 10px; border-radius: 999px; }
.split-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.feat { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 12px; }
.feat li { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 500; transition: transform .25s ease, border-color .25s ease; }
.feat li:hover { transform: translateX(4px); border-color: var(--c); }
:root[dir="rtl"] .feat li:hover { transform: translateX(-4px); }
.fic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--soft); color: var(--c); }
.fic svg { width: 19px; height: 19px; }
.split-link { justify-self: start; display: inline-flex; align-items: center; gap: 8px; color: var(--c); font-weight: 600; text-decoration: none; margin-top: 4px; }
.split-link svg { width: 18px; height: 18px; transition: transform .25s ease; }
:root[dir="rtl"] .split-link svg { transform: scaleX(-1); }
.split-link:hover svg { transform: translateX(5px); }
:root[dir="rtl"] .split-link:hover svg { transform: scaleX(-1) translateX(5px); }
@media (max-width: 600px) { .split-media { padding: 16px 8px 30px; } .split-media .mini.top { display: none; } }

/* ── Phone: text over photos gets a full veil, sections sit closer ── */
@media (max-width: 600px) {
  section { padding-block: 52px; }
  .hero { height: auto; }
  .hero-inner { padding-block: 40px 22px; gap: 34px; }
  /* Dense behind the words, lighter where only the photo shows, a little denser again under the slide tabs */
  .hero::after, :root[dir="rtl"] .hero::after { background: linear-gradient(180deg, rgba(var(--ov), .92) 0%, rgba(var(--ov), .88) 46%, rgba(var(--ov), .55) 70%, rgba(var(--ov), .2) 84%, rgba(var(--ov), .62) 100%); }
  .cta-box::after, :root[dir="rtl"] .cta-box::after { background: linear-gradient(180deg, rgba(var(--ov), .93) 0%, rgba(var(--ov), .85) 58%, rgba(var(--ov), .35) 100%); }
  /* The two reassurances sit where the veil is lightest: a frosted badge keeps them readable on any photo */
  .hero-meta { justify-self: start; background: rgba(var(--ov), .84); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--ov-line); border-radius: 12px; padding: 8px 12px; gap: 6px 16px; color: var(--on-ov); font-weight: 500; }
  .head { margin-bottom: 26px; }
  .split + .split { margin-top: 56px; }
  .numbers { padding-block: 8px; }
  .price-ctrl { margin-bottom: 30px; }
  footer .wrap { flex-direction: column; align-items: flex-start; }
  footer .wrap > div:last-child { justify-items: start !important; }
}

/* Contact e-mail: in the closing banner and the footer */
.num a.mail { color: var(--on-ov); font-weight: 600; direction: ltr; unicode-bidi: isolate; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ov-line); }
.num a.mail:hover { text-decoration-color: currentColor; }
.foot-mail { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; direction: ltr; unicode-bidi: isolate; justify-self: start; }
.foot-mail svg { width: 16px; height: 16px; color: var(--indigo); }
.foot-mail:hover { color: var(--indigo); }

/* Arabic figures: the unit follows the number in reading order (1 دقيقة), not the Latin order */
:root[dir="rtl"] .stat b { direction: rtl; }
:root[dir="rtl"] .stat b small { font-family: var(--f-body); font-size: .38em; font-weight: 600; }

/* Arabic: the text sits on the right, so the photos behind it are mirrored to keep people on the free side */
:root[dir="rtl"] .slide .ph, :root[dir="rtl"] .cta-box > .ph { transform: scaleX(-1); }
.login { color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 10px; }
.login:hover { background: var(--band); }
.login { display: inline-flex; align-items: center; gap: 7px; }
.login svg { width: 17px; height: 17px; flex: none; }
:root[dir="rtl"] .login svg { transform: scaleX(-1); }
.login .short, .lang .short { display: none; }
/* Phone: the sign-in stays in the bar, in a compact form; the language button shows its initial */
@media (max-width: 520px) {
  .nav .wrap { gap: 10px; }
  .nav-end { gap: 6px; }
  .logo img { height: 24px; }
  .lang { padding: 9px 11px; }
  .lang .long, .login .long { display: none; }
  .lang .short, .login .short { display: inline; }
  .login { padding: 9px 10px; border: 1.5px solid var(--line); font-size: 13px; }
  .nav .btn { padding: 10px 13px; }
}

/* Features shared by every plan */
/* One card under the plans: what every plan includes, in an even grid (no pill that looks clickable,
   no orphan on the last line), then the reassurances and the currency note as its footer. */
.allfeat { margin-top: 26px; display: grid; gap: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: clamp(20px, 3vw, 28px) clamp(18px, 3vw, 32px); }
.allfeat > b { justify-self: center; font: 700 16px/1.3 var(--f-display); color: var(--ink); }
#allfeat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 24px; }
#allfeat span { display: flex; align-items: center; gap: 12px; font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 1.35; }
#allfeat i { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 12%, transparent); }
#allfeat svg { width: 18px; height: 18px; color: var(--c); }
.allfeat-foot { display: grid; gap: 10px; justify-items: center; border-top: 1px solid var(--line); padding-top: 20px; }
.allfeat-foot .assure { margin-top: 0; }
.allfeat-foot .price-note { margin-top: 0; font-size: 13px; }
@media (max-width: 960px) { #allfeat { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 360px) { #allfeat { grid-template-columns: 1fr; } }

/* Inline logo in text: cap height of the wordmark matches the surrounding letters */
.kd { display: inline-block; direction: ltr; vertical-align: -0.17em; line-height: 0; margin-inline: .05em; }
.kd img { height: 1.08em; width: auto; }
.kd .ink { display: var(--show-ink); }
.kd .paper { display: var(--show-paper); }
h1 .kd img, h2 .kd img { height: 1em; }
.hero .kd .ink, .cta-box .kd .ink, .num-card .kd .ink { display: var(--show-ink); }

/* ── More motion, all small and purposeful ── */
/* Section heads: the four-colour stripe draws itself in */
.stripe i { transform-origin: left center; }
:root[dir="rtl"] .stripe i { transform-origin: right center; }
.head.in .stripe i, .hero-copy .stripe i { animation: grow .6s cubic-bezier(.2, .7, .2, 1) both; }
.head.in .stripe i:nth-child(2), .hero-copy .stripe i:nth-child(2) { animation-delay: .08s; }
.head.in .stripe i:nth-child(3), .hero-copy .stripe i:nth-child(3) { animation-delay: .16s; }
.head.in .stripe i:nth-child(4), .hero-copy .stripe i:nth-child(4) { animation-delay: .24s; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
/* Primary buttons: a light sweep on hover */
.btn-primary { position: relative; overflow: hidden; isolation: isolate; }
.btn-primary::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .32) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s ease; }
.btn-primary:hover::after { transform: translateX(120%); }
/* Photos breathe on hover; the small cards on them float */
.split-media .ph img, .day-card .ph img { transition: opacity .5s, transform .9s cubic-bezier(.2, .7, .2, 1); }
.split-media:hover .ph img, .day-card:hover .ph img { transform: scale(1.05); }
.split-media .mini { animation: bob 6s ease-in-out infinite; }
.split.rev .split-media .mini { animation-delay: -3s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
/* Cards lift on hover */
.day-card, .plan, .fact, .ba-card { transition: transform .3s ease, box-shadow .3s ease; }
.day-card:hover, .plan:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
.fact .fi { transition: transform .3s ease; }
.fact:hover .fi { transform: rotate(-8deg) scale(1.08); }
/* FAQ answers slide in */
details[open] > p { animation: up .4s ease both; }
/* Hero progress tabs: a soft glow on the active one */
.sd.on { font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .bg-pebbles svg { translate: none !important; }
  .sd.on i { width: 100%; }
}
</style>

/* ── State & helpers ──────────────────────────────────────────── */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function detectCurrency() {
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  const nl = (navigator.language || '').toUpperCase();
  if (tz === 'Africa/Algiers' || nl.endsWith('-DZ')) return 'DZD';
  if (tz === 'Africa/Casablanca' || nl.endsWith('-MA')) return 'MAD';
  if (tz === 'Africa/Tunis' || nl.endsWith('-TN')) return 'TND';
  if (tz === 'Asia/Riyadh' || nl.endsWith('-SA')) return 'SAR';
  if (tz === 'Asia/Dubai' || nl.endsWith('-AE')) return 'AED';
  if (tz === 'Europe/London') return 'GBP';
  if (/^America\/(Toronto|Vancouver|Montreal|Edmonton|Winnipeg|Halifax|Regina|St_Johns)/.test(tz)) return 'CAD';
  if (tz.startsWith('Europe/')) return 'EUR';
  return 'USD';
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = {
  lang: store.get('kdp-lang') || ((navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'fr'),
  slide: 0, show: 0, yearly: false,
  cur: 'DZD'
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (id) => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const L = () => T[state.lang];
const waLink = (text) => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`;
function waMsg(title, sub, sentence) {
  const D = L();
  return [`*${title}*`, sub ? `_${sub}_` : null, '', sentence].filter((x) => x !== null).join(String.fromCharCode(10));
}
const COLORS = ['var(--indigo)', 'var(--green)', 'var(--orange)', 'var(--red)'];
const SOFTS = ['var(--indigo-soft)', 'var(--green-soft)', 'var(--orange-soft)', 'var(--red-soft)'];
const SHAPES = ['sh-circle', 'sh-slab', 'sh-dome', 'sh-slab2'];

function money(n, cur) {
  const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(n).replace(/ /g, ' ');
  if (cur === 'DZD') return state.lang === 'ar' ? `${nf} دج` : `${nf} DA`;
  try { return new Intl.NumberFormat(state.lang === 'ar' ? 'ar-u-nu-latn' : 'fr-FR', { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(n); } catch (e) { return `${nf} ${cur}`; }
}

/* Photo slot: placeholder art made of the logo's shapes, replaced by images/<name>.jpg when it exists */
function photo(name, label, tone, i) {
  const k = (i || 0) % 4;
  const art = `<svg class="ph-art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <use href="#${SHAPES[k]}" x="${200 + k * 20}" y="-40" width="300" height="300" style="color:var(--ph-fg);opacity:.16"/>
      <use href="#${SHAPES[(k + 1) % 4]}" x="-60" y="${120 - k * 10}" width="260" height="260" style="color:var(--ph-fg);opacity:.10"/>
      <use href="#${SHAPES[(k + 2) % 4]}" x="150" y="170" width="140" height="140" style="color:var(--ph-fg);opacity:.13"/>
    </svg>`;
  return `<figure class="ph ${tone}" data-photo="${name}">${art}<img alt="${esc(label)}" data-src="${PHOTO_DIR}${name}.jpg"><span class="ph-tag">${ico('i-camera')}<span>${esc(label)}</span></span></figure>`;
}
function loadPhotos(root) {
  (root || document).querySelectorAll('.ph img[data-src]').forEach((img) => {
    const fig = img.closest('.ph');
    img.onload = () => fig.classList.add('has-img');
    img.onerror = () => fig.classList.remove('has-img');
    img.src = img.dataset.src;
    img.removeAttribute('data-src');
  });
}

let slideTimer = null;
function renderHero() {
  const S = L().slides;

  $('#dots').innerHTML = S.map((s, i) => `<button class="sd" role="tab" type="button" style="--c:${s.color};--dur:${SLIDE_MS}ms" aria-selected="${i === state.slide}">${esc(s.tab)}<small>${esc(s.small)}</small><i></i></button>`).join('');
  loadPhotos($('#slides'));
  goSlide(state.slide, true);
}
function goSlide(n, first) {
  const S = L().slides;
  state.slide = (n + S.length) % S.length;
  document.querySelectorAll('.slide').forEach((el, i) => { el.classList.toggle('on', i === state.slide); el.setAttribute('aria-hidden', String(i !== state.slide)); });
  document.querySelectorAll('.sd').forEach((el, i) => {
    el.classList.remove('on', 'done'); void el.offsetWidth;
    if (i < state.slide) el.classList.add('done');
    if (i === state.slide) el.classList.add('on');
    el.setAttribute('aria-selected', String(i === state.slide));
  });
  const fc = $('#float-card'), s = S[state.slide];
  const paint = () => { fc.innerHTML = `<span class="fi" style="background:${s.color}">${ico(s.fc[0])}</span><b>${esc(s.fc[1])}</b><span>${esc(s.fc[2])}</span>`; fc.classList.remove('swap'); };
  if (first) paint(); else { fc.classList.add('swap'); setTimeout(paint, 300); }
  clearTimeout(slideTimer);
  if (!reduced) slideTimer = setTimeout(() => goSlide(state.slide + 1), SLIDE_MS);
}
$('#dots').addEventListener('click', (e) => { const b = e.target.closest('.sd'); if (b) goSlide([...b.parentNode.children].indexOf(b)); });

  $('#assure').innerHTML = D.assure.map(([ic, t]) => `<span>${ico(ic)}${esc(t)}</span>`).join('');
  $('#faqs').innerHTML = D.faqs.map(([q, a], i) => `<details${i === 0 ? ' open' : ''}><summary>${esc(q)}<span class="pm">${ico('i-plus')}</span></summary><p>${esc(a)}</p></details>`).join('');
  $('#faq-media').innerHTML = photo('faq-equipe', D['faq.photo'], 't-green', 2);
  const box = $('#cta-box');
  box.querySelectorAll(':scope > .ph').forEach((n) => n.remove());
  box.insertAdjacentHTML('afterbegin', photo('cta-cour', D['cta.photo'], '', 3));
  box.querySelector('.ph').style.setProperty('--ph-fg', '#8C86FF');
  renderPlans();
  loadPhotos();
}
function renderPlans() {
  $('#allfeat').innerHTML = L().allFeat.map(([ic, t], i) => `<span style="--c:${COLORS[i % 4]}"><i>${ico(ic)}</i>${esc(t)}</span>`).join('');
  const D = L(), p = PRICES[state.cur];
  $('#bill-m').setAttribute('aria-pressed', String(!state.yearly));
  $('#bill-y').setAttribute('aria-pressed', String(state.yearly));
  $('#plans').innerHTML = D.plans.map((pl, i) => {
    let amount;
    if (i < 2) {
      const m = p[i];
      amount = state.yearly
        ? `<b>${money(m * 10, state.cur)}</b><span class="per">${esc(D['price.perYear'])}</span><span class="was">${esc(D['price.instead'])} <s>${money(m * 12, state.cur)}</s></span>`
        : `<b>${money(m, state.cur)}</b><span class="per">${esc(D['price.perMonth'])}</span>`;
      // What one child costs per month at the plan's limit (a yearly plan spread over 12 months), to the nearest 5 DA.
      const perChild = Math.round((state.yearly ? m * 10 / 12 : m) / CAPS[i] / 5) * 5;
      amount += `<span class="child">${esc(D['price.perChild'].replace('{n}', money(perChild, state.cur)).replace('{cap}', CAPS[i]))}</span>`;
    } else amount = `<b>${esc(D['price.quote'])}</b>`;
    const c = [COLORS[1], COLORS[0], COLORS[2]][i];
    return `<article class="plan${i === 1 ? ' featured' : ''}" style="--c:${c}">
      ${i === 1 ? `<span class="rec">${esc(D['price.rec'])}</span>` : ''}
      <h3>${esc(pl.name)}</h3><p class="for">${esc(pl.for)}</p>
      <div class="amount">${amount}</div>
      <ul class="ticks">${pl.items.map((t) => `<li>${ico('i-tick')}<span>${esc(t)}</span></li>`).join('')}</ul>
      <a class="btn ${i === 1 ? 'btn-primary' : 'btn-line'}" href="${waLink(waMsg(D['wa.planTitle'].replace('{plan}', pl.name), i < 2 ? `${money(state.yearly ? p[i] * 10 : p[i], state.cur)} ${state.yearly ? D['price.perYear'] : D['price.perMonth']}` : D['price.quote'], D['wa.plan'].replace('{plan}', pl.name)))}" target="_blank" rel="noopener">${i === 2 ? ico('i-wa') : ''}${esc(i === 2 ? D['price.contact'] : D['price.choose'])}</a>
    </article>`;
  }).join('');
}

/* ── Render all ───────────────────────────────────────────────── */
function render() {
  const D = L(), root = document.documentElement;
  root.lang = state.lang; root.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { const v = D[el.dataset.t]; if (v == null) return; if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll('a.wa').forEach((a) => { a.href = waLink(waMsg(D['wa.demoTitle'], null, D['wa.demo'])); });
  $('#wa-num').textContent = WHATSAPP_DISPLAY;
  renderHero();
  renderShowTabs(); goShow(state.show);
  renderSections();
  setupReveal();
}

/* ── Scroll reveal: elements rest visible; entering the viewport plays a short rise ── */
let revealObs = null;
function countUp(b) {
  const to = Number(b.dataset.to), v = b.querySelector('.v');
  if (reduced || !v || !to) return;
  const t0 = performance.now(), dur = 900;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); v.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
  v.textContent = '0'; requestAnimationFrame(step);
}
function setupReveal() {
  if (reduced || !('IntersectionObserver' in window)) return;
  if (revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      e.target.querySelectorAll('b[data-to]').forEach(countUp);
      revealObs.unobserve(e.target);
    });
  }, { threshold: 0.18 });
  const groups = ['.head', '.fact', '.ba-card', '.stat', '.split', '.day-card', '.step', '.plan', '.faqs details', '.show', '.cta-box'];
  groups.forEach((sel) => document.querySelectorAll(sel).forEach((el, i) => {
    const r = el.getBoundingClientRect();
    if (r.top < innerHeight) return; // already in the first view: leave it at rest
    el.classList.add('rv'); el.style.setProperty('--i', i % 4); revealObs.observe(el);
  }));
}

/* ── Brand: every "Kiddoo" in running text becomes the logo, sized to the text around it ── */
const LOGO_INK = document.querySelector('.nav .logo img.ink').src;
const LOGO_PAPER = document.querySelector('.nav .logo img.paper').src;
const SKIP = 'script,style,title,option,select,textarea,.logo,.kd,.lightbox';
function brandify(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.nodeValue.includes('Kiddoo') && !n.parentElement.closest(SKIP)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    const frag = document.createDocumentFragment();
    node.nodeValue.split(/(Kiddoo)/).forEach((part) => {
      if (part !== 'Kiddoo') { if (part) frag.appendChild(document.createTextNode(part)); return; }
      const s = document.createElement('span');
      s.className = 'kd'; s.setAttribute('role', 'img'); s.setAttribute('aria-label', 'Kiddoo');
      s.innerHTML = `<img class="ink" src="${LOGO_INK}" alt=""><img class="paper" src="${LOGO_PAPER}" alt="">`;
      frag.appendChild(s);
    });
    node.replaceWith(frag);
  });
}
brandify(document.body);
new MutationObserver((muts) => muts.forEach((m) => m.addedNodes.forEach((n) => {
  if (n.nodeType === 1) brandify(n);
  else if (n.nodeType === 3 && n.parentElement) brandify(n.parentElement);
}))).observe(document.body, { childList: true, subtree: true });

/* ── Background pebbles: the logo's four shapes spread down the whole page ── */
// [shape, top % of the page, side, offset (px, negative = past the edge), size (px), tint, start/end rotation, parallax speed]
const PEBBLES = [
  ['sh-circle', 9, 'end', -140, 460, 'p-i', [0, 14], 0.06],
  ['sh-slab', 13, 'start', -120, 360, 'p-g', [-10, 6], -0.04],
  ['sh-dome', 21, 'end', -60, 260, 'p-o', [12, -4], 0.08],
  ['sh-slab2', 27, 'start', -40, 220, 'p-r', [8, -8], 0.05],
  ['sh-circle', 34, 'start', -180, 420, 'p-o', [0, 10], -0.05],
  ['sh-slab', 41, 'end', -100, 380, 'p-i', [14, 0], 0.07],
  ['sh-dome', 49, 'start', -90, 320, 'p-g', [-6, 10], 0.04],
  ['sh-slab2', 56, 'end', -50, 240, 'p-o', [-12, 4], -0.06],
  ['sh-circle', 63, 'end', -160, 380, 'p-r', [0, 12], 0.05],
  ['sh-slab', 70, 'start', -110, 340, 'p-i', [6, -10], -0.05],
  ['sh-dome', 78, 'end', -80, 300, 'p-g', [-8, 8], 0.06],
  ['sh-slab2', 85, 'start', -60, 260, 'p-r', [10, -6], 0.04],
  ['sh-circle', 92, 'end', -120, 340, 'p-o', [0, 10], -0.04]
];
function renderPebbles() {
  $('#bg-pebbles').innerHTML = PEBBLES.map(([sh, top, side, off, size, tint, rot, speed], i) =>
    `<svg viewBox="0 0 24 24" class="${tint}" data-speed="${speed}" style="--s:${size}px;top:${top}%;inset-inline-${side}:${off}px;--r0:${rot[0]}deg;--r1:${rot[1]}deg;--d:${16 + (i % 5) * 3}s;animation-delay:-${i * 2}s"><use href="#${sh}"/></svg>`).join('');
}
renderPebbles();
if (!reduced) {
  const pebbles = [...document.querySelectorAll('#bg-pebbles svg')];
  // Each pebble drifts by how far it is from the middle of the screen, not by the whole scroll,
  // so the ones far down the page are still where they were placed when they come into view.
  let centers = [];
  const measure = () => {
    const box = $('#bg-pebbles'), top = box.getBoundingClientRect().top + scrollY;
    centers = PEBBLES.map(([, pct, , , size]) => top + box.offsetHeight * pct / 100 + size / 2);
  };
  let ticking = false;
  const parallax = () => {
    ticking = false;
    const mid = scrollY + innerHeight / 2;
    pebbles.forEach((p, i) => p.style.setProperty('--py', `${((mid - centers[i]) * Number(p.dataset.speed)).toFixed(1)}px`));
  };
  measure(); parallax();
  addEventListener('resize', () => { measure(); parallax(); });
  addEventListener('load', () => { measure(); parallax(); });
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(parallax); } }, { passive: true });
}

/* ── Nav: shadow on scroll, current section ───────────────────── */
addEventListener('scroll', () => { $('.nav').classList.toggle('scrolled', scrollY > 8); }, { passive: true });
if ('IntersectionObserver' in window) {
  const links = [...document.querySelectorAll('.nav-links a')];
  const spy = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  ['produit', 'journee', 'tarifs', 'questions'].forEach((id) => { const s = document.getElementById(id); if (s) spy.observe(s); });
}

$('#splits').addEventListener('click', (e) => {
  const a = e.target.closest('.split-link'); if (!a) return;
  goShow(Number(a.dataset.tab), true);
});

/* ── Screenshot lightbox ──────────────────────────────────────── */
function openLightbox(img) {
  $('#lb-img').src = img.src; $('#lb-img').alt = img.alt;
  $('#lightbox').hidden = false; $('#lb-close').focus();
}
function closeLightbox() { $('#lightbox').hidden = true; }
$('#show-stage').addEventListener('click', (e) => { const img = e.target.closest('.win, .phone'); if (img && img.querySelector('img.zoomable')) openLightbox(img.querySelector('img.zoomable')); });
$('#lightbox').addEventListener('click', (e) => { if (e.target.id !== 'lb-img') closeLightbox(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#lightbox').hidden) closeLightbox(); });

/* ── Events ───────────────────────────────────────────────────── */
$('#lang-btn').addEventListener('click', () => { state.lang = state.lang === 'fr' ? 'ar' : 'fr'; store.set('kdp-lang', state.lang); render(); });
$('#bill-m').addEventListener('click', () => { state.yearly = false; renderPlans(); });
$('#bill-y').addEventListener('click', () => { state.yearly = true; renderPlans(); });
function dayStep(dir) {
  const tr = $('#day-track'), card = tr.querySelector('.day-card');
  const w = card ? card.getBoundingClientRect().width + 18 : 300;
  const rtl = document.documentElement.dir === 'rtl';
  tr.scrollBy({ left: (rtl ? -dir : dir) * w, behavior: reduced ? 'auto' : 'smooth' });
}
$('#day-prev').addEventListener('click', () => dayStep(-1));
$('#day-next').addEventListener('click', () => dayStep(1));
$('#copy-num').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  const done = () => { btn.textContent = L()['cta.copied']; setTimeout(() => { btn.textContent = L()['cta.copy']; }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#wa-num')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(WHATSAPP_DISPLAY).then(done, fallback); } catch (err) { fallback(); }
});
// E-mail button: opens the little menu above it; a click elsewhere or Escape closes it.
const mailPop = $('#mail-pop'), mailBtn = $('#fab-mail');
const setMailPop = (open) => { mailPop.hidden = !open; mailBtn.setAttribute('aria-expanded', String(open)); };
mailBtn.addEventListener('click', () => setMailPop(mailPop.hidden));
mailPop.addEventListener('click', (e) => { if (e.target.closest('a')) setMailPop(false); });
document.addEventListener('click', (e) => { if (!mailPop.hidden && !e.target.closest('#mail-pop, #fab-mail')) setMailPop(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !mailPop.hidden) { setMailPop(false); mailBtn.focus(); } });
$('#mail-copy').addEventListener('click', (e) => {
  const label = e.currentTarget.querySelector('span');
  const done = () => { label.textContent = L()['mail.copied']; setTimeout(() => { label.textContent = L()['mail.copy']; }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#mail-addr')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText('contact@kiddooschool.com').then(done, fallback); } catch (err) { fallback(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(slideTimer); clearTimeout(showTimer); }
  else { goSlide(state.slide); goShow(state.show); }
});

render();
</script>
