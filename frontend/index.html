<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: in the installed app the page runs under the iPhone
         home bar; the bottom tab bar pads itself with the safe-area inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EduNest</title>

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EduNest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Preconnect to Google Fonts to reduce latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts load beside the page without holding its first paint: text shows
         in the system font, then switches (display=swap) when they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Baloo+Bhaijaan+2:wght@600;700;800&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Baloo+Bhaijaan+2:wght@600;700;800&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Baloo+Bhaijaan+2:wght@600;700;800&amp;display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
