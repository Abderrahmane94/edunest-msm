<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <title>EduNest — Hors ligne</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #FAFAF8;
        color: #111827;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 360px; }
      .logo { display: block; width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #6B7280; margin: 0 0 4px; }
      .ar { direction: rtl; margin-top: 16px; }
      button {
        margin-top: 24px; padding: 10px 20px; border: 0; border-radius: 8px;
        background: #4F46E5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icon-192.png" alt="EduNest" width="72" height="72" />
      <h1>Vous êtes hors ligne</h1>
      <p>EduNest a besoin d'une connexion Internet. Vérifiez votre connexion puis réessayez.</p>
      <div class="ar">
        <h1>أنت غير متصل</h1>
        <p>يحتاج EduNest إلى اتصال بالإنترنت. تحقق من اتصالك ثم أعد المحاولة.</p>
      </div>
      <button type="button" onclick="location.reload()">Réessayer · إعادة المحاولة</button>
    </div>
  </body>
</html>
