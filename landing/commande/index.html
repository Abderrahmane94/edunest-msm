<style>
/* The order page: the site's calm white canvas and four brand colours, with the order form in the first screen. */
:root {
  --canvas: #FFFFFF; --band: #F5F4F1; --card: #FFFFFF; --ink: #111018; --text: #34323D; --muted: #6A6775; --line: #E5E2DC;
  --indigo: #4F49CF; --green: #13855F; --orange: #C25A12; --red: #CF2A50;
  --indigo-soft: #ECEBFB; --green-soft: #E2F3EC; --orange-soft: #FBEDE2; --red-soft: #FBE6EB;
  --shadow: 0 1px 2px rgba(17,16,24,.06), 0 18px 40px -18px rgba(17,16,24,.28);
  --f-display: "Manrope", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --ls: -0.03em; color-scheme: light;
}
:root[lang="ar"] { --f-display: "IBM Plex Sans Arabic", system-ui, sans-serif; --f-body: "IBM Plex Sans Arabic", system-ui, sans-serif; --ls: 0; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--text); font-family: var(--f-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); letter-spacing: var(--ls); text-wrap: balance; margin: 0; }
p { margin: 0; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1160px; margin-inline: auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)); }
section { padding-block: clamp(56px, 7vw, 92px); scroll-margin-top: 72px; }
.stripe { display: flex; gap: 4px; height: 4px; width: 72px; }
.stripe i { flex: 1; border-radius: 4px; }
.stripe i:nth-child(1) { background: var(--indigo); } .stripe i:nth-child(2) { background: var(--green); }
.stripe i:nth-child(3) { background: var(--orange); } .stripe i:nth-child(4) { background: var(--red); }
.head { max-width: 700px; margin: 0 auto 40px; text-align: center; }
.head .stripe { margin: 0 auto 18px; }
.head h2 { font-size: clamp(28px, 3.6vw, 40px); line-height: 1.12; margin-bottom: 12px; }
.head p { color: var(--muted); font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 600 16px/1 var(--f-body); text-decoration: none; padding: 16px 22px; border-radius: 12px; border: 1.5px solid transparent; cursor: pointer; transition: background .2s, transform .2s; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--indigo); color: #fff; }
.btn-primary:hover { background: #423cb8; }
.btn-line { border-color: var(--line); color: var(--ink); background: #fff; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* Nav */
.nav { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
.logo { display: inline-flex; direction: ltr; }
.logo img { height: 28px; width: auto; }
.nav-end { margin-inline-start: auto; display: flex; gap: 10px; align-items: center; }
.lang { background: none; border: 1.5px solid var(--line); color: var(--ink); font: 500 14px/1 var(--f-body); padding: 10px 13px; border-radius: 10px; cursor: pointer; }
.nav .btn { padding: 11px 16px; font-size: 14px; }

/* Hero + form */
.hero { padding-block: clamp(32px, 5vw, 64px); background: linear-gradient(180deg, #F7F6FD 0%, #FFFFFF 70%); }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(28px, 4vw, 56px); align-items: start; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--indigo); background: var(--indigo-soft); padding: 7px 12px; border-radius: 999px; }
:root[lang="ar"] .kicker { letter-spacing: 0; }
.hero h1 { font-size: clamp(34px, 4.6vw, 54px); line-height: 1.06; font-weight: 800; margin: 18px 0 16px; }
:root[lang="ar"] .hero h1 { line-height: 1.3; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--indigo); }
.hero .sub { font-size: 18px; color: var(--muted); max-width: 560px; }
.ticks { list-style: none; padding: 0; margin: 22px 0 26px; display: grid; gap: 10px; }
.ticks li { display: flex; gap: 10px; align-items: center; font-weight: 500; color: var(--ink); }
.ticks li::before { content: "✓"; flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-weight: 700; font-size: 14px; }
.shot { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--band); }
.shot img { width: 100%; height: auto; }

.order { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 1px 2px rgba(17,16,24,.06), 0 30px 60px -30px rgba(79,73,207,.45); padding: clamp(20px, 3vw, 30px); position: sticky; top: 84px; scroll-margin-top: 84px; }
.order h2 { font-size: 24px; margin-bottom: 4px; }
.order .lead { color: var(--muted); font-size: 15px; margin-bottom: 18px; }
.plans { display: grid; gap: 10px; margin-bottom: 14px; border: 0; padding: 0; }
.plans legend, .field label, .cycle-label { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 8px; padding: 0; }
.plan { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.plan input { position: absolute; opacity: 0; pointer-events: none; }
.plan .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.plan .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--indigo); transform: scale(0); transition: transform .15s; }
.plan .nm { font-weight: 600; color: var(--ink); line-height: 1.25; }
.plan .for { font-size: 13px; color: var(--muted); }
.plan .pr { margin-inline-start: auto; text-align: end; font-weight: 700; color: var(--ink); white-space: nowrap; }
.plan .pr small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.plan .rec { position: absolute; top: -10px; inset-inline-end: 14px; font-size: 11px; font-weight: 700; background: var(--indigo); color: #fff; padding: 3px 8px; border-radius: 999px; }
.plan:has(input:checked) { border-color: var(--indigo); background: #FAFAFF; }
.plan:has(input:checked) .dot { border-color: var(--indigo); }
.plan:has(input:checked) .dot::after { transform: scale(1); }
.plan:has(input:focus-visible) { outline: 3px solid var(--indigo); outline-offset: 2px; }
.cycle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--band); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
.cycle label { text-align: center; padding: 10px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted); position: relative; }
.cycle input { position: absolute; opacity: 0; }
.cycle label:has(input:checked) { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(17,16,24,.12); }
.cycle .save { display: block; font-size: 11px; color: var(--green); font-weight: 700; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; }
.field.full { grid-column: 1 / -1; }
.field input, .field select { font: 500 16px/1.2 var(--f-body); color: var(--ink); padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; width: 100%; min-width: 0; }
.field input:focus, .field select:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }
.field input[aria-invalid="true"], .field select[aria-invalid="true"] { border-color: var(--red); }
.field .err { color: var(--red); font-size: 13px; margin-top: 4px; min-height: 0; }
/* Out of sight without an offset: an offset would widen the page in Arabic (RTL). */
.hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.fields { position: relative; }
.total { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 12px; padding-top: 14px; border-top: 1px dashed var(--line); }
.total span { color: var(--muted); font-size: 14px; }
.total b { font: 800 22px/1 var(--f-display); color: var(--ink); }
.order .btn-primary { width: 100%; padding: 18px; font-size: 17px; }
.order .btn-primary[disabled] { opacity: .7; cursor: progress; }
.reassure { margin-top: 12px; font-size: 13.5px; color: var(--muted); text-align: center; }
.form-error { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--red-soft); color: var(--red); font-size: 14px; }
.done { text-align: center; padding: 18px 4px; }
.done .ok { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 16px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-size: 32px; font-weight: 800; }
.done h2 { margin-bottom: 8px; }
.done p { color: var(--muted); margin-bottom: 18px; }
.done .num { display: inline-block; font-weight: 700; color: var(--ink); background: var(--band); padding: 6px 12px; border-radius: 10px; margin-bottom: 16px; direction: ltr; }

/* Before / after */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 26px; }
.tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; margin-bottom: 16px; }
.before .tag { background: var(--red-soft); color: var(--red); }
.after .tag { background: var(--green-soft); color: var(--green); }
.after { border-color: #B9DCCD; }
.ba ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ba li { display: flex; gap: 12px; align-items: flex-start; }
.ba li::before { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 14px; margin-top: 1px; }
.before li::before { content: "×"; background: var(--red-soft); color: var(--red); }
.after li::before { content: "✓"; background: var(--green-soft); color: var(--green); }

/* Modules */
.band { background: var(--band); }
.mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.mod { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.mod .pic { aspect-ratio: 16 / 10; background: var(--band); border-bottom: 1px solid var(--line); overflow: hidden; }
.mod .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
:root[dir="rtl"] .mod .pic img { object-position: top right; }
.mod .body { padding: 20px 22px 24px; border-top: 4px solid var(--c); }
.mod:nth-child(4n+1) { --c: var(--indigo); } .mod:nth-child(4n+2) { --c: var(--green); } .mod:nth-child(4n+3) { --c: var(--orange); } .mod:nth-child(4n+4) { --c: var(--red); }
.mod h3 { font-size: 19px; line-height: 1.3; margin-bottom: 8px; }
.mod p { font-size: 15.5px; }

/* Steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; margin-bottom: 14px; font: 800 18px/1 var(--f-display); background: var(--indigo-soft); color: var(--indigo); }
.steps h3 { font-size: 18px; margin-bottom: 6px; }
.steps p { font-size: 15px; }

/* FAQ */
.faqs { max-width: 780px; margin: 0 auto; border-top: 1px solid var(--line); }
.faqs details { border-bottom: 1px solid var(--line); }
.faqs summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; padding: 20px 2px; font: 600 17px/1.4 var(--f-body); color: var(--ink); }
.faqs summary::-webkit-details-marker { display: none; }
.faqs summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--indigo); transition: transform .2s; }
.faqs details[open] summary::after { transform: rotate(45deg); }
.faqs details p { padding: 0 2px 20px; color: var(--muted); }

/* Final call */
.final { text-align: center; background: var(--indigo-soft); border-radius: 24px; padding: clamp(36px, 6vw, 60px) 24px; }
.final .stripe { margin: 0 auto 18px; }
.final h2 { font-size: clamp(26px, 3.4vw, 36px); margin-bottom: 10px; }
.final p { color: var(--muted); }
.final .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
footer { padding: 32px 0 calc(32px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; text-align: center; }

/* Mobile order bar */
.mbar { display: none; }
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
  .order { position: static; }
  .hero .shot { display: none; }
  .mods, .steps { grid-template-columns: 1fr 1fr; }
  .mbar { display: flex; position: fixed; inset: auto 0 0 0; z-index: 30; gap: 12px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -10px 30px -18px rgba(17,16,24,.35); transform: translateY(110%); transition: transform .25s; }
  .mbar.on { transform: none; }
  .mbar .p { font-size: 13px; color: var(--muted); line-height: 1.2; }
  .mbar .p b { display: block; font: 800 18px/1.2 var(--f-display); color: var(--ink); }
  .mbar .btn { margin-inline-start: auto; padding: 14px 20px; }
  footer { padding-bottom: 96px; }
}
@media (max-width: 640px) {
  .ba, .mods, .steps { grid-template-columns: 1fr; }
  .fields { grid-template-columns: 1fr; }
  .nav .btn { display: none; }
  .card { padding: 22px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Kiddoo"><img src="../images/logo-ink.png" alt="Kiddoo" width="140" height="31"></a>
    <div class="nav-end">
      <button class="lang" id="lang" type="button"></button>
      <a class="btn btn-primary" href="#commande" data-i="nav.cta"></a>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="kicker" data-i="hero.kicker"></span>
        <h1 data-i="hero.title" data-html></h1>
        <p class="sub" data-i="hero.sub"></p>
        <ul class="ticks" id="ticks"></ul>
        <figure class="shot" style="margin:0"><img id="hero-shot" alt="" width="1600" height="1000"></figure>
      </div>

      <div class="order" id="commande">
        <form id="form" novalidate>
          <h2 data-i="form.title"></h2>
          <p class="lead" data-i="form.lead"></p>

          <fieldset class="plans" id="plans"><legend data-i="form.plan"></legend></fieldset>

          <div class="cycle" role="radiogroup" id="cycle-group">
            <label><input type="radio" name="cycle" value="monthly" checked><span data-i="form.monthly"></span></label>
            <label><input type="radio" name="cycle" value="annual"><span data-i="form.annual"></span><span class="save" data-i="form.save"></span></label>
          </div>

          <div class="fields">
            <div class="field full">
              <label for="f-name" data-i="form.name"></label>
              <input id="f-name" name="directorName" autocomplete="name" maxlength="80" required>
              <span class="err" id="e-name" role="alert"></span>
            </div>
            <div class="field full">
              <label for="f-nursery" data-i="form.nursery"></label>
              <input id="f-nursery" name="nurseryName" autocomplete="organization" maxlength="100" required>
              <span class="err" id="e-nursery" role="alert"></span>
            </div>
            <div class="field">
              <label for="f-phone" data-i="form.phone"></label>
              <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr" placeholder="05 55 12 34 56" required>
              <span class="err" id="e-phone" role="alert"></span>
            </div>
            <div class="field">
              <label for="f-children" data-i="form.children"></label>
              <input id="f-children" name="childrenCount" type="number" inputmode="numeric" min="1" max="2000" required>
              <span class="err" id="e-children" role="alert"></span>
            </div>
            <div class="field full">
              <label for="f-wilaya" data-i="form.wilaya"></label>
              <select id="f-wilaya" name="wilaya" required></select>
              <span class="err" id="e-wilaya" role="alert"></span>
            </div>
            <!-- Left empty by people, filled by bots: the server drops those orders. -->
            <div class="hp" aria-hidden="true"><label for="f-website">Website</label><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
          </div>

          <div class="total"><span data-i="form.total"></span><b id="total"></b></div>
          <button class="btn btn-primary" type="submit" id="submit"><span data-i="form.submit"></span></button>
          <p class="reassure" data-i="form.reassure"></p>
          <div class="form-error" id="form-error" role="alert" hidden></div>
        </form>

        <div class="done" id="done" hidden tabindex="-1">
          <div class="ok" aria-hidden="true">✓</div>
          <h2 data-i="done.title"></h2>
          <span class="num" id="done-num"></span>
          <p data-i="done.text"></p>
          <a class="btn btn-line" id="done-wa" target="_blank" rel="noopener"><span data-i="done.wa"></span></a>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="head"><div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h2 data-i="ba.title"></h2><p data-i="ba.sub"></p></div>
      <div class="ba">
        <div class="card before"><span class="tag" data-i="ba.before"></span><ul id="before"></ul></div>
        <div class="card after"><span class="tag" data-i="ba.after"></span><ul id="after"></ul></div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <div class="head"><div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h2 data-i="mods.title"></h2><p data-i="mods.sub"></p></div>
      <div class="mods" id="mods"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="head"><div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h2 data-i="steps.title"></h2></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <div class="head"><h2 data-i="faq.title"></h2><p data-i="faq.sub"></p></div>
      <div class="faqs" id="faqs"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="final">
        <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h2 data-i="final.title"></h2>
        <p data-i="final.sub"></p>
        <div class="btns">
          <a class="btn btn-primary" href="#commande" data-i="final.btn"></a>
          <a class="btn btn-line" id="final-wa" target="_blank" rel="noopener" data-i="final.wa"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer><span data-i="foot"></span> · <a href="/" data-i="foot.site"></a></footer>

<div class="mbar" id="mbar" aria-hidden="true">
  <div class="p"><span data-i="mbar.from"></span><b id="mbar-price"></b></div>
  <a class="btn btn-primary" href="#commande" data-i="nav.cta" tabindex="-1"></a>
</div>

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
let lang = params.get('lang') === 'ar' ? 'ar' : (params.get('lang') === 'fr' ? 'fr' : (localStorageGet('kd-lang') || 'fr'));
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
const T = () => COPY[lang];
const fmt = (n) => new Intl.NumberFormat('fr-FR').format(n).replace(/ | /g, ' ');
// In Arabic the amount stays in reading order ("4 900", not "900 4"): a left-to-right isolate around it.
const money = (n) => (lang === 'ar' ? `⁦${fmt(n)}⁩ دج` : `${fmt(n)} DA`);
const waLink = (text) => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function selectedPlan() { return PLANS.find((p) => p.id === (document.querySelector('input[name=plan]:checked') || {}).value) || PLANS[1]; }
function selectedCycle() { return (document.querySelector('input[name=cycle]:checked') || {}).value || 'monthly'; }
function amount() { const p = selectedPlan(); if (p.monthly == null) return null; return selectedCycle() === 'annual' ? annual(p.monthly) : p.monthly; }

function renderPlans() {
  const D = T(), cyc = selectedCycle(), current = (document.querySelector('input[name=plan]:checked') || {}).value || 'standard';
  const box = $('#plans');
  box.querySelectorAll('.plan').forEach((n) => n.remove());
  PLANS.forEach((p, i) => {
    const [nm, forWho] = D.plans[i];
    const price = p.monthly == null ? D['plan.quote'] : money(cyc === 'annual' ? annual(p.monthly) : p.monthly);
    const per = p.monthly == null ? '' : `<small>${cyc === 'annual' ? D['per.year'] : D['per.month']}</small>`;
    const el = document.createElement('label');
    el.className = 'plan';
    el.innerHTML = `<input type="radio" name="plan" value="${p.id}" ${p.id === current ? 'checked' : ''}>${p.rec ? `<span class="rec">${esc(D['plan.rec'])}</span>` : ''}<span class="dot" aria-hidden="true"></span><span><span class="nm">${esc(nm)}</span><br><span class="for">${esc(forWho)}</span></span><span class="pr">${esc(price)}${per}</span>`;
    box.appendChild(el);
  });
  $('#cycle-group').hidden = selectedPlan().monthly == null;
  renderTotal();
}
function renderTotal() {
  const a = amount(), D = T();
  $('#total').textContent = a == null ? D['plan.quote'] : money(a);
  $('#cycle-group').hidden = selectedPlan().monthly == null;
}

function apply() {
  const D = T();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach((el) => {
    const v = D[el.dataset.i]; if (v == null) return;
    if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  $('#lang').textContent = D['lang.switch'];
  $('#ticks').innerHTML = D.ticks.map((x) => `<li>${esc(x)}</li>`).join('');
  $('#before').innerHTML = D.before.map((x) => `<li>${esc(x)}</li>`).join('');
  $('#after').innerHTML = D.after.map((x) => `<li>${esc(x)}</li>`).join('');
  $('#mods').innerHTML = D.mods.map(([k, h, p]) => `<article class="card mod"><div class="pic"><img src="../images/app/${k}-${lang}.jpg" alt="${esc(D['mod.alt'].replace('{t}', h))}" loading="lazy" width="1600" height="1000"></div><div class="body"><h3>${esc(h)}</h3><p>${esc(p)}</p></div></article>`).join('');
  $('#steps').innerHTML = D.steps.map(([h, p]) => `<li class="card"><h3>${esc(h)}</h3><p>${esc(p)}</p></li>`).join('');
  $('#faqs').innerHTML = D.faqs.map(([q, a], i) => `<details${i === 0 ? ' open' : ''}><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
  const shot = $('#hero-shot'); shot.src = `../images/app/dash-${lang}.jpg`; shot.alt = D['shot.alt'];
  const sel = $('#f-wilaya'), keep = sel.value;
  sel.innerHTML = `<option value="">${esc(D['form.wilayaPick'])}</option>` + WILAYAS.map(([fr, ar], i) => { const code = String(i + 1).padStart(2, '0'); return `<option value="${code}">${code} · ${esc(lang === 'ar' ? ar : fr)}</option>`; }).join('');
  sel.value = keep;
  $('#final-wa').href = waLink(D['wa.ask']);
  $('#mbar-price').textContent = money(PLANS[0].monthly) + ' ' + D['per.month'];
  document.title = lang === 'ar' ? 'اطلب Kiddoo · برنامج تسيير الروضة' : 'Commander Kiddoo · Logiciel de gestion de crèche';
  renderPlans();
}

$('#lang').addEventListener('click', () => { lang = lang === 'fr' ? 'ar' : 'fr'; localStorageSet('kd-lang', lang); apply(); });
$('#form').addEventListener('change', (e) => {
  if (e.target.name === 'cycle') renderPlans();
  if (e.target.name === 'plan') renderTotal();
});

// InitiateCheckout once, the first time someone starts filling the form.
let started = false;
$('#form').addEventListener('focusin', () => {
  if (started) return; started = true;
  if (window.fbq) fbq('track', 'InitiateCheckout', { currency: 'DZD', value: amount() || 0, content_name: selectedPlan().id });
});

/* ── Order ────────────────────────────────────────────────────────────────── */
function cookie(name) { const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : undefined; }
// Meta's click id: the _fbc cookie, or built from ?fbclid= when the pixel has not set it yet.
function fbc() { const c = cookie('_fbc'); if (c) return c; const id = params.get('fbclid'); return id ? `fb.1.${Date.now()}.${id}` : undefined; }
function uuid() { return (crypto.randomUUID && crypto.randomUUID()) || 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2); }
const normPhone = (s) => { let d = s.replace(/\D/g, ''); if (d.startsWith('00213')) d = '0' + d.slice(5); else if (d.startsWith('213') && d.length === 12) d = '0' + d.slice(3); return d; };

// Meta's advanced matching fields, normalised as Meta asks (lowercase, no punctuation, phone with country code).
function matchData(name, phone, wilaya) {
  const words = name.toLowerCase().replace(/[^\p{L}\s]/gu, '').trim().split(/\s+/).filter(Boolean);
  const w = WILAYAS[Number(wilaya) - 1];
  const m = { ph: '213' + normPhone(phone).replace(/^0/, ''), country: 'dz' };
  if (words[0]) m.fn = words[0];
  if (words.length > 1) m.ln = words[words.length - 1];
  if (w) m.ct = w[0].toLowerCase().normalize('NFD').replace(/[^a-z]/g, '');
  return m;
}

function setErr(id, field, msg) {
  $(id).textContent = msg || '';
  $(field).setAttribute('aria-invalid', msg ? 'true' : 'false');
  return !msg;
}
function validate() {
  const D = T();
  const ok = [
    setErr('#e-name', '#f-name', $('#f-name').value.trim().length >= 2 ? '' : D['err.name']),
    setErr('#e-nursery', '#f-nursery', $('#f-nursery').value.trim().length >= 2 ? '' : D['err.nursery']),
    setErr('#e-phone', '#f-phone', /^0[5-7]\d{8}$|^0[2-4]\d{7,8}$/.test(normPhone($('#f-phone').value)) ? '' : D['err.phone']),
    setErr('#e-children', '#f-children', Number($('#f-children').value) >= 1 ? '' : D['err.children']),
    setErr('#e-wilaya', '#f-wilaya', $('#f-wilaya').value ? '' : D['err.wilaya']),
  ];
  const first = document.querySelector('[aria-invalid="true"]');
  if (first) first.focus();
  return ok.every(Boolean);
}

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#form-error').hidden = true;
  if (!validate()) return;
  const D = T(), btn = $('#submit'), label = btn.innerHTML;
  btn.disabled = true; btn.textContent = D['form.sending'];
  const eventId = uuid();
  const utm = {}; ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach((k) => { if (params.get(k)) utm[k] = params.get(k).slice(0, 120); });
  const body = {
    plan: selectedPlan().id, cycle: selectedCycle(),
    directorName: $('#f-name').value.trim(), nurseryName: $('#f-nursery').value.trim(),
    phone: $('#f-phone').value.trim(), wilaya: $('#f-wilaya').value, childrenCount: Number($('#f-children').value),
    language: lang, website: $('#f-website').value,
    tracking: { eventId, fbp: cookie('_fbp'), fbc: fbc(), pageUrl: location.href.split('#')[0].slice(0, 500), utm },
  };
  try {
    const res = await fetch(`${API_URL}/orders/public`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok || !json.success) throw new Error('send');
    const num = json.data && json.data.number ? json.data.number : '';
    // Advanced matching with the form's data, then the browser's Lead with the server's event id: Meta keeps one.
    const match = matchData(body.directorName, body.phone, body.wilaya);
    localStorageSet('kd-match', JSON.stringify(match));
    if (window.fbq) fbq('init', '2354393235321830', match);
    if (window.fbq) fbq('track', 'Lead', { currency: 'DZD', value: amount() || 0, content_name: body.plan }, { eventID: eventId });
    $('#done-num').textContent = num;
    $('#done-num').hidden = !num;
    $('#done-wa').href = waLink(D['wa.after'].replace('{num}', num).replace('{nursery}', body.nurseryName));
    $('#form').hidden = true; $('#done').hidden = false; $('#done').focus();
  } catch (err) {
    $('#form-error').innerHTML = `${esc(D['err.send'])} <a href="${waLink(D['wa.ask'])}" target="_blank" rel="noopener">${esc(WHATSAPP_DISPLAY)}</a>`;
    $('#form-error').hidden = false;
  } finally {
    btn.disabled = false; btn.innerHTML = label;
  }
});

// The mobile order bar: shown once the form is out of view, hidden while it is on screen.
const bar = $('#mbar');
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([en]) => bar.classList.toggle('on', !en.isIntersecting && window.scrollY > 200)).observe($('#commande'));
}

apply();
</script>
</body>
</html>
